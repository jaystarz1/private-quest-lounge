version: "3.9"

# private-quest-lounge: forked from Hubs-Foundation/hubs-compose.
# Mutagen sync replaced with direct bind mounts (mutagen-compose 0.18.x speaks
# Docker API 1.43, which Docker Desktop >= 29 refuses). Named volumes mask
# container-built artifacts (node_modules, Elixir _build) so linux/amd64
# binaries never mix with the macOS host checkout.

services:
  db:
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready"]
    image: "postgres:14-alpine"
    user: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  dialog:
    build:
      context: .
      dockerfile: dockerfiles/dialog.Dockerfile
    environment:
      AUTH_KEY: /etc/perms.pub.pem
      HTTPS_CERT_FULLCHAIN: /etc/ssl/fullchain.pem
      HTTPS_CERT_PRIVKEY: /etc/ssl/privkey.pem
      INTERACTIVE: "false"
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40031
      MEDIASOUP_ANNOUNCED_IP: ${PRIVATE_NETWORK_IP}
    ports:
      - "4443:4443"
      # Must match MEDIASOUP_MIN_PORT..MEDIASOUP_MAX_PORT. Two participants
      # need only a handful of ports; keep the range small for startup time.
      - "40000-40031:40000-40031"
      - "40000-40031:40000-40031/udp"
    volumes:
      - ./services/dialog:/code
      - dialog-node-modules:/code/node_modules
    working_dir: /code
  hubs-admin:
    build:
      context: .
      dockerfile: dockerfiles/hubs.Dockerfile
    command: npm run local
    environment:
      INTERNAL_HOSTNAME: hubs-admin
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8989/admin.html"]
    platform: linux/amd64
    ports:
      - "8989:8989"
    volumes:
      - ./services/hubs:/code
      - hubs-node-modules:/code/node_modules
      - hubs-admin-node-modules:/code/admin/node_modules
    working_dir: /code/admin
  hubs-client:
    build:
      context: .
      dockerfile: dockerfiles/hubs.Dockerfile
    command: npm run local
    environment:
      INTERNAL_HOSTNAME: hubs-client
    healthcheck:
      start_period: 3m30s
      test: ["CMD", "curl", "-fk", "https://localhost:8080"]
    platform: linux/amd64
    ports:
      - "8080:8080"
    volumes:
      - ./services/hubs:/code
      - hubs-node-modules:/code/node_modules
      - hubs-admin-node-modules:/code/admin/node_modules
    working_dir: /code
  hubs-storybook:
    build:
      context: .
      dockerfile: dockerfiles/hubs.Dockerfile
    command: npm run storybook
    healthcheck:
      test: ["CMD", "curl", "-fk", "http://hubs.local:6006"]
    platform: linux/amd64
    ports:
      - "6006:6006"
    profiles: ["extras"]
    volumes:
      - ./services/hubs:/code
      - hubs-node-modules:/code/node_modules
      - hubs-admin-node-modules:/code/admin/node_modules
    working_dir: /code
  postgrest:
    build:
      context: .
      dockerfile: dockerfiles/postgrest.Dockerfile
  reticulum:
    build:
      context: ./services/reticulum
      dockerfile: TurkeyDockerfile
      target: dev
    depends_on:
      - db
    environment:
      DB_CREDENTIALS: postgres
      DB_HOST: db
      DIALOG_HOSTNAME: "hubs.local"
      DIALOG_PORT: 4443
      HUBS_ADMIN_INTERNAL_HOSTNAME: hubs-admin
      HUBS_CLIENT_INTERNAL_HOSTNAME: hubs-client
      POSTGREST_INTERNAL_HOSTNAME: postgrest
      SPOKE_INTERNAL_HOSTNAME: spoke
    ports:
      - "4000:4000"
    volumes:
      - ./services/reticulum:/code
      - reticulum-build:/code/_build
      - retstorage:/code/storage/dev
  spoke:
    build:
      context: .
      dockerfile: dockerfiles/spoke.Dockerfile
    environment:
      CORS_PROXY_SERVER: "hubs-proxy.local:4000"
      INTERNAL_HOSTNAME: spoke
    platform: linux/amd64
    ports:
      - "9090:9090"
    profiles: ["extras"]
    volumes:
      - ./services/spoke:/code
      - spoke-node-modules:/code/node_modules
networks:
  default:
    name: mozilla-hubs
volumes:
  dialog-node-modules:
  hubs-node-modules:
  hubs-admin-node-modules:
  pgdata:
  reticulum-build:
  retstorage:
  spoke-node-modules:
