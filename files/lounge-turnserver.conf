# Lounge-only relay, authenticated with Reticulum's rotating TURN secrets.
listening-port=3478
min-port=40032
max-port=40063
realm=ret
fingerprint
use-auth-secret
psql-userdb="host=db dbname=ret_dev user=postgres password=postgres connect_timeout=5 options='-c search_path=coturn'"
no-tls
no-tcp-relay
no-multicast-peers
no-software-attribute
stale-nonce=600
user-quota=12
total-quota=24
max-bps=2500000
bps-capacity=20000000
max-allocate-lifetime=600
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Only the SFU's announced public/LAN addresses are allowed by Compose.
log-file=stdout
simple-log
